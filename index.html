<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI/UX Design – Wireframes</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    figure { border: 1px solid #e5e5e5; padding: 12px; border-radius: 8px; background: #fafafa; }
    img { width: 100%; height: auto; display: block; }
    .embed { aspect-ratio: 16/9; width: 100%; border: 1px solid #e5e5e5; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>UI/UX Design</h1>
  <p>Wireframes and prototypes.</p>

  <h2>WhatsApp Chat List – Wireframe (images)</h2>
  <div class="grid">
    <figure>
      <img src="wireframe/screen1.png" alt="WhatsApp wireframe" />
      <figcaption>Chat list wireframe</figcaption>
    </figure>
  </div>

  <h2>Figma Prototype (interactive)</h2>
  <!-- Replace the src below with your Figma EMBED link -->
  <iframe
    class="embed"
    style="width:100%;"
    src="https://www.figma.com/design/7M2MhPBLU6Fr9wl3jiAwxK/wireframe_whatsup?node-id=5-2&m=dev&t=E39e5ClhBk5zzWy2-1"
    allowfullscreen>
  </iframe>
</body>
</html>
